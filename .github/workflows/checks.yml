name: Checks
on:
  push:
    branches: [main, rust-backend, firmware-layer-reporting]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Rust toolchain and native dependencies
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y liblzma-dev pkg-config
      - name: Rust formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release
      - name: Python and configuration tests
        run: ./keycorner.sh test
      - name: Firmware layer protocol tests
        run: |
          cc -Wall -Wextra -Werror -DQMK_KEYBOARD_H='"fake_qmk.h"' -I tests/firmware tests/firmware/layers_test.c -o /tmp/keycorner-firmware-test
          /tmp/keycorner-firmware-test
      - name: Compile Python sources
        run: python -m compileall -q keycorner install.py tests
      - name: Check manifest and license
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          m = json.loads(Path('manifest.json').read_text())
          assert m['schemaVersion'] == 1 and m['license'] == 'MIT'
          for path in m['entryPoints'].values():
              resolved = (root/path).resolve()
              assert resolved.is_relative_to(root) and resolved.is_file()
          assert Path('LICENSE').is_file()
          PY
