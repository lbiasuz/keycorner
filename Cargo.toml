[package]
name = "keycorner"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Event-driven keyboard overlay backend for Omarchy"

[dependencies]
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
xz2 = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
